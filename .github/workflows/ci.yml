name: CI

on:
  push:
    branches:
      - claude/ai-creator-curriculum-app-0cb3f9
      - claude/install-ruflo-DTD3O
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
